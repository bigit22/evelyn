[project]
name = "evelyn"
version = "0.1.0"
description = "AI-powered job search assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115", # веб-фреймворк
    "uvicorn>=0.32", # сервер, который запускает FastAPI
    "httpx>=0.28", # HTTP-клиент (для запросов к hh.ru и AI API)
    "pydantic-settings>=2.6", # читает .env файл
    "jinja2>=3.1", # HTML-шаблоны
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3", # тесты
    "pytest-asyncio>=0.24", # тесты для async-кода
    "ruff>=0.8", # линтер + форматтер
    "mypy>=1.13", # проверка типов
    "pre-commit>=4.0", # хуки перед коммитом
    "httpx", # для тестов FastAPI (TestClient)
]

# Настройки ruff (линтер)
[tool.ruff]
target-version = "py311"     # мы пишем под Python 3.11+
line-length = 100            # макс. длина строки

[tool.ruff.lint]
# Какие правила включить:
# E = ошибки, F = pyflakes, I = сортировка импортов,
# N = именование, W = предупреждения, UP = современный синтаксис,
# B = баги, SIM = упрощение кода
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

# Настройки mypy (проверка типов)
[tool.mypy]
python_version = "3.11"
strict = true                # строгий режим (требует аннотации типов)

[tool.setuptools.packages.find]
include = ["app*"]
